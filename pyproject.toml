[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsim"
version = "1.1.0"
description = "Analytical and Monte Carlo model for single-photon-interference quantum repeaters"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "qutip>=5.0",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_waiting_time.py",
    "test_analytical_model.py",
    "test_figure_histograms.py",
]
addopts = "-q"
